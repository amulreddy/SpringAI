<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Spring AI Chatbot (Local Ollama)</title>
    <style>
        :root {
            --bg: #0f1117;
            --panel: #171a23;
            --user: #2563eb;
            --bot: #262b38;
            --text: #e6e8ee;
            --muted: #8b90a0;
            --accent: #22c55e;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            padding: 14px 20px;
            background: var(--panel);
            border-bottom: 1px solid #222634;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        header h1 { font-size: 16px; margin: 0; font-weight: 600; }
        .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
        header .model { color: var(--muted); font-size: 12px; margin-left: auto; }
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .msg {
            max-width: 720px;
            padding: 10px 14px;
            border-radius: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .msg.user { align-self: flex-end; background: var(--user); color: #fff; border-bottom-right-radius: 4px; }
        .msg.bot  { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
        .msg.bot.pending::after { content: "▋"; animation: blink 1s steps(2) infinite; }
        @keyframes blink { 50% { opacity: 0; } }
        form {
            display: flex;
            gap: 10px;
            padding: 16px 20px;
            background: var(--panel);
            border-top: 1px solid #222634;
        }
        #input {
            flex: 1;
            resize: none;
            background: #0f1117;
            color: var(--text);
            border: 1px solid #2a2f3d;
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 14px;
            font-family: inherit;
        }
        #input:focus { outline: none; border-color: var(--user); }
        button {
            background: var(--user);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 0 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .hint { color: var(--muted); font-size: 12px; padding: 0 20px 10px; }
    </style>
</head>
<body>
    <header>
        <span class="dot"></span>
        <h1>Spring AI Chatbot</h1>
        <span class="model">local · Ollama · llama3.2:3b</span>
    </header>

    <div id="chat">
        <div class="msg bot">Hi! I'm running entirely on your machine via Ollama. Ask me anything.</div>
    </div>

    <form id="form">
        <textarea id="input" rows="1" placeholder="Type a message…  (Enter to send, Shift+Enter for newline)" autofocus></textarea>
        <button type="submit" id="send">Send</button>
    </form>
    <div class="hint">No cloud APIs. Conversation memory is kept per browser session.</div>

    <script>
        const chat = document.getElementById('chat');
        const form = document.getElementById('form');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('send');

        // Stable per-tab conversation id so the server-side memory groups our turns.
        const conversationId = 'web-' + Math.random().toString(36).slice(2);

        function addMessage(text, who) {
            const el = document.createElement('div');
            el.className = 'msg ' + who;
            el.textContent = text;
            chat.appendChild(el);
            chat.scrollTop = chat.scrollHeight;
            return el;
        }

        // Auto-grow the textarea.
        input.addEventListener('input', () => {
            input.style.height = 'auto';
            input.style.height = Math.min(input.scrollHeight, 160) + 'px';
        });

        // Enter to send, Shift+Enter for newline.
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                form.requestSubmit();
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = input.value.trim();
            if (!message) return;

            addMessage(message, 'user');
            input.value = '';
            input.style.height = 'auto';
            sendBtn.disabled = true;

            const botEl = addMessage('', 'bot');
            botEl.classList.add('pending');

            try {
                const res = await fetch('/api/chat/stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message, conversationId })
                });

                if (!res.ok || !res.body) {
                    throw new Error('HTTP ' + res.status);
                }

                // Read the streamed body chunk by chunk and append tokens as they arrive.
                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });

                    // The endpoint emits text/event-stream: lines beginning with "data:".
                    // Split on newlines and strip the SSE "data:" prefix when present.
                    const parts = buffer.split('\n');
                    buffer = parts.pop(); // keep incomplete trailing line
                    for (const line of parts) {
                        const trimmed = line.startsWith('data:') ? line.slice(5) : line;
                        if (trimmed.length) {
                            botEl.textContent += trimmed;
                            chat.scrollTop = chat.scrollHeight;
                        }
                    }
                }
                // Flush any remainder.
                if (buffer) {
                    const trimmed = buffer.startsWith('data:') ? buffer.slice(5) : buffer;
                    botEl.textContent += trimmed;
                }
            } catch (err) {
                botEl.textContent = '⚠️ Error: ' + err.message +
                    '\nIs the app running and is Ollama reachable at localhost:11434?';
            } finally {
                botEl.classList.remove('pending');
                sendBtn.disabled = false;
                input.focus();
                chat.scrollTop = chat.scrollHeight;
            }
        });
    </script>
</body>
</html>
